<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Missing Customer Rows</title>
<style>
  :root{
    --ink:#16161f; --muted:#8e8e9a; --soft:#5b5b6b; --line:#efeff3; --bg:#f6f6f9;
    --amber-bg:#fdf8e6; --amber-border:#f3dfa3; --amber-ink:#b4530a; --violet:#7c3aed;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Plus Jakarta Sans",system-ui,-apple-system,Segoe UI,sans-serif;padding:24px 16px}
  h1{font-size:18px;margin:0 0 4px}
  .sub{color:var(--muted);font-size:13px;margin:0 0 24px;line-height:1.5}
  .opt{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:28px;overflow-x:auto}
  .opt h2{font-size:15px;margin:0 0 4px}
  .opt p{font-size:12.5px;color:var(--soft);margin:0 0 14px;line-height:1.5;max-width:760px}
  .widths{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
  .wlabel{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin-bottom:6px}

  /* card shell (unchanged from live) */
  .card{border:1px solid var(--amber-border);border-radius:14px;overflow:hidden;background:#fff}
  .head{background:var(--amber-bg);padding:14px 16px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--amber-border)}
  .hl{font-size:12px;display:flex;align-items:center;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--amber-ink)}
  .big{font-size:24px;font-weight:700;margin-top:4px}
  .big small{font-size:12px;color:var(--muted);font-weight:500}
  .meta{font-size:11px;color:var(--muted);margin-top:2px}
  .ring{width:44px;height:44px;border-radius:50%;border:4px solid #cfd3dc;border-top-color:#22a35a;border-right-color:#16161f;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
  .mail{color:var(--violet);font-size:11px;margin-left:3px}
  .num{font-variant-numeric:tabular-nums}
  button.row{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--line);background:#fff;font:inherit;color:inherit;cursor:pointer}
  button.row:first-child{border-top:0}
  button.row:hover{background:#faf9ff}

  /* ---------- Option 1: label grid (narrow card) ---------- */
  .g{padding:12px 16px}
  .g .ship{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .g .bill{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .g .bill b{color:var(--soft);font-weight:600}
  .g .grid{display:grid;grid-template-columns:1fr auto;column-gap:10px;row-gap:6px;margin-top:9px}
  .g .k{font-size:9.5px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .g .v{font-size:12px;font-weight:600;color:var(--ink);white-space:nowrap}
  .g .v.dim{color:#c4c4cc;font-weight:500}
  .g .r{text-align:right}
  .g .kgv{font-size:13px;font-weight:700}
  .g .kgv small{font-size:10.5px;color:var(--muted);font-weight:500}

  .g .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .g .top .ship{min-width:0}
  .g .kgv{flex:none}
  .g .docs{display:grid;grid-template-columns:1fr 1fr;column-gap:12px;margin-top:9px;padding-top:8px;border-top:1px dashed var(--line)}
  .g .doc{min-width:0}
  .g .doc .v{font-size:12px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .g .doc .d{font-size:11px;color:var(--muted);white-space:nowrap;margin-top:1px}

  /* ---------- Option 2: full-width table card ---------- */
  .t{width:100%;border-collapse:collapse}
  .thead,.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.6fr) 104px 96px 100px 70px;column-gap:14px;align-items:center;padding:0 16px}
  .thead{height:32px;background:#fbfbfc;border-bottom:1px solid var(--line);font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
  .trow{height:44px;font-size:12.5px}
  .trow .c{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .trow .ship{font-weight:700}
  .trow .bill{color:var(--soft)}
  .trow .ref{color:var(--soft)}
  .trow .dim{color:#c4c4cc}
  .trow .kg{text-align:right;font-weight:700}
  .trow .kg small{font-weight:500;color:var(--muted);font-size:10.5px}
  .thead .rr{text-align:right}
  .wide .head{padding:12px 16px}
  .wide .hrow{display:flex;align-items:center;gap:18px}

  .narrowgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-bottom:20px}
  .ghost{border:1px dashed #d9d9e2;border-radius:14px;height:120px;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .note{font-size:11.5px;color:var(--soft);background:#f4f1ff;border-radius:8px;padding:8px 10px;margin-top:12px;line-height:1.5;max-width:760px}
</style>
</head>
<body>
<h1>Missing customer card — full redo</h1>
<p class="sub">Option 1, reworked. Sample data. ✉ = time came from the order email, not SAP (same mark as the Floor table). Empty invoice is left blank (no dash — house rule).</p>

<div id="out"></div>

<script>
const rows=[
  {n:"JVR ENTERPRISE",bt:"JVR ENTERPRISE",obd:"9109546671",t:"06 Oct 17:15",mail:false,inv:"I536230906",idt:"06 Oct",kg:142},
  {n:"URJA INDUSTRY",bt:"SHREE HARI PAINTS",obd:"9109551203",t:"08 Oct 11:02",mail:true,inv:"",kg:520},
  {n:"OM SOLITIARE",bt:"KRISHNA HARDWARE & PAINTS",obd:"9109551288",t:"08 Oct 14:40",mail:false,inv:"",kg:902},
  {n:"DHAVA GIR",bt:"DHAVA GIR",obd:"9109548817",t:"07 Oct 09:26",mail:false,inv:"I536231544",idt:"07 Oct",kg:374},
  {n:"R&B SRAVAN CHEMICALS",bt:"MAHAVIR COLOUR CENTRE",obd:"9109552019",t:"09 Oct 16:55",mail:true,inv:"",kg:1508},
];
const fmt=v=>v.toLocaleString("en-IN");
const time=r=>`${r.t}${r.mail?'<span class="mail">✉</span>':''}`;
const head=`<div><div class="hl"><span class="dot"></span>Missing customer</div>
  <div class="big">3,446 <small>kg</small></div><div class="meta"><b>5</b> stops · <b>3,080</b> L</div></div>
  <div class="ring">5</div>`;

/* Option 1 — label grid, stays a normal card */
const rowG=r=>`<button class="row g">
  <div class="top"><div class="ship">${r.n}</div><div class="kgv num">${fmt(r.kg)} <small>kg</small></div></div>
  <div class="bill">Bill to <b>${r.bt}</b></div>
  <div class="docs">
    <div class="doc"><div class="k">OBD</div><div class="v num">${r.obd}</div><div class="d num">${time(r)}</div></div>
    <div class="doc"><div class="k">Invoice</div>${r.inv?`<div class="v num">${r.inv}</div><div class="d num">${r.idt}</div>`:``}</div>
  </div></button>`;
const cardG=w=>`<div class="card" style="width:${w}px"><div class="head">${head}</div>${rows.map(rowG).join("")}</div>`;

/* Option 2 — full-width table card */
const rowT=r=>`<button class="row trow">
  <span class="c ship">${r.n}</span>
  <span class="c bill">${r.bt}</span>
  <span class="c num">${time(r)}</span>
  <span class="c num ref">${r.obd}</span>
  <span class="c num ${r.inv?'ref':'dim'}">${r.inv||'&nbsp;'}</span>
  <span class="c num kg">${fmt(r.kg)} <small>kg</small></span></button>`;
const cardT=w=>`<div class="card wide" style="width:${w}px">
  <div class="head"><div class="hrow">${head.replace('<div class="ring">5</div>','')}</div><div class="ring">5</div></div>
  <div class="thead"><span>Ship to</span><span>Bill to</span><span>OBD date</span><span>OBD no</span><span>Invoice</span><span class="rr">Weight</span></div>
  ${rows.map(rowT).join("")}</div>`;

document.getElementById("out").innerHTML=`
<section class="opt"><h2>1 (reworked) — two documents side by side</h2>
 <p><b>Top line:</b> ship-to name, weight on the right (weight is about the load, so it sits with the name).<br>
 <b>Second line:</b> bill-to.<br>
 <b>Below a thin divider, two equal columns, both left-aligned:</b> OBD on the left (number, then its date + time), Invoice on the right (number, then its date). Each column is one document, so number and date always sit together. No invoice yet → the Invoice column is blank.</p>
 <div class="widths">
  <div><div class="wlabel">4 columns · ~205px</div>${cardG(205)}</div>
  <div><div class="wlabel">2 columns · ~430px</div>${cardG(430)}</div>
 </div></section>
<div class="note"><b>Time source:</b> the row uses the same time as the Floor bill table (email time when the bill matched a mail order that day, marked ✉). The detail panel shows SAP’s punch time, so the two can differ on ✉ bills — existing behaviour.</div>`;
</script>
</body>
</html>
