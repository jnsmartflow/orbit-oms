<title>Tint Tab Redesign</title>

<style>
:root{
--brand-50:#F5F3FF;--brand-100:#EDE9FE;--brand-600:#7C3AED;--brand-700:#6D28D9;--brand-800:#5B21B6;

*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:"Plus Jakarta Sans",system-ui,sans-serif;font-size:13px;line-height:1.4;color:var(--ink-900);background:var(--ink-0);-webkit-font-smoothing:antialiased}

.num{font-variant-numeric:tabular-nums}
button{font-family:inherit;font-size:inherit;cursor:pointer}

.nav .wm{font-weight:700;color:var(--brand-800);font-size:14px;letter-spacing:-.02em}

.rl{flex:1;overflow:auto;padding:4px 12px 16px}
.rc{background:#fff;border:1px solid var(--ink-100);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:10px}
.rc .a{display:flex;justify-content:space-between;gap:10px}
.rc .n{font-weight:700;font-size:14.5px}
.rc .b{font-size:12px;color:var(--ink-500);margin-top:2px}

.age{margin-left:auto;font-size:11px;font-weight:700;border-radius:5px;padding:1px 6px;background:var(--warn-bg);color:var(--warn-text)}

.tabs{display:flex;gap:26px;height:100%}

.tab.on{color:var(--ink-900);font-weight:700;border-bottom-color:var(--ink-900)}.tab.on .c{background:var(--ink-900);color:#fff}
.live{font-size:12px;color:var(--ink-500);display:flex;align-items:center;gap:7px}
.live:before{content:"";width:7px;height:7px;border-radius:50%;background:var(--ok)}
.scroll{flex:1;overflow:auto}
.page{padding:24px 28px 48px;display:flex;flex-direction:column;gap:20px;max-width:1500px}

.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}

.kl{font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-400);font-weight:600}
.kv{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1}

.ks{font-size:12px;color:var(--ink-500);margin-top:8px}
.prog{height:6px;border-radius:4px;background:var(--ink-50);margin-top:10px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok);border-radius:4px}

.axis{border-bottom:1px solid var(--line);background:var(--ink-25);font-size:11px;color:var(--ink-400);height:30px;align-items:center}

.ticks{position:relative;height:100%;margin:0 8px}
.ticks span{position:absolute;top:8px;transform:translateX(-50%)}

.orow{min-height:84px;border-bottom:1px solid var(--line);cursor:pointer;position:relative;transition:background .12s}
.orow:last-child{border-bottom:0}
.orow:hover{background:var(--ink-25)}
.orow.on{background:var(--brand-50)}
.orow.on:before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--brand-600)}
.who{display:flex;gap:12px;align-items:center;padding:14px 16px 14px 20px;min-width:0}

.av .sd{position:absolute;right:-1px;bottom:-1px;width:11px;height:11px;border-radius:50%;border:2px solid #fff;background:var(--ink-200)}

.res{text-align:right;padding-right:20px}

tr.grp td{height:38px;background:var(--ink-25);font-weight:700;font-size:12.5px;border-bottom:1px solid var(--line)}

tr.tinting td{background:var(--tint-bg)}tr.tinting td:first-child{box-shadow:inset 3px 0 0 var(--tint-600)}
tr.paused td{background:var(--warn-bg)}
tr.done td{color:var(--ink-600)}
.r{text-align:right}.mut{color:var(--ink-500)}
.obd .d{display:block;font-family:"Plus Jakarta Sans";font-size:11px;color:var(--ink-400);margin-top:1px}

.rank{display:flex;align-items:center;gap:8px}
.rank b{width:16px;text-align:center;font-size:12.5px}
.mv{display:flex;flex-direction:column;gap:3px;opacity:0;transition:opacity .12s}
tr.row:hover .mv{opacity:1}
.mv button{width:32px;height:21px;border:1px solid var(--ink-200);background:#fff;border-radius:6px;font-size:12px;line-height:1;color:var(--ink-700);display:flex;align-items:center;justify-content:center;padding:0}
.mv button:hover:not(:disabled){background:var(--brand-50);border-color:var(--brand-600);color:var(--brand-700)}
.mv button:disabled{opacity:.25;cursor:default}
.due{display:inline-block;border:1px solid var(--ink-200);border-radius:var(--r-sm);padding:2px 8px;font-size:12px;background:#fff}
.due.none{border-style:dashed;color:var(--ink-400);font-weight:600;font-size:11px}
.pill{font-size:11px;border-radius:6px;padding:3px 8px;font-weight:600;display:inline-flex;gap:6px;align-items:center}
.pill small{font-weight:500;opacity:.75}
.p-tint{background:#fff;color:var(--tint-700);border:1px solid var(--tint-bd)}
.p-tint:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tint-600)}
.p-asg{background:var(--ink-50);color:var(--ink-600)}
.p-pause{background:#fff;color:var(--warn-text);border:1px solid var(--warn-bd)}
.p-done{background:var(--ok-bg);color:var(--ok-text)}

.ophead{display:flex;align-items:baseline;gap:10px;padding:14px 20px 4px;font-weight:700;font-size:13.5px}

.empty{padding:28px;text-align:center;color:var(--ink-400)}

 const first=Math.min(...dn.map(j=>toM(j.start))),pace=Math.round(dL/((NOW-first)/60));
 const avg=Math.round(dn.reduce((a,j)=>a+(toM(j.end)-toM(j.start)),0)/dn.length);
 const p=Math.round(dL/(dL+qL)*100);
 return `<div class="sec"><div class="kpi">
  <div><div class="kl">Tinted today</div><div class="kv num">${fmtL(dL)}<small>L</small></div><div class="ks">${dn.length} jobs · ${arts(dn)}</div></div>
  <div><div class="kl">Still to tint</div><div class="kv num">${fmtL(qL)}<small>L</small></div><div class="ks">${qq.length} jobs across ${OPS.length} operators</div></div>
  <div><div class="kl">Pace</div><div class="kv num">${fmtL(pace)}<small>L / hr</small></div><div class="ks">since first job at ${hm(first)}</div></div>
  <div><div class="kl">Average job</div><div class="kv num">${Math.round(avg)}<small>min</small></div><div class="ks">start to done · ${dn.length} jobs</div></div>
 </div></div>`}

function board(){
 let ticks="";for(let m=T0;m<=T1;m+=120)ticks+=`<span style="left:${pct(m)}%">${hm(m)}</span>`;
 ticks+=`<span class="nowp" style="left:${pct(NOW)}%">${hm(NOW)}</span>`;
 const rows=OPS.map((op,i)=>{const s=stats(op),k=s.now?s.now.st:"idle";
  const st=k==="tinting"?`<b>Tinting</b> · ${s.now.site} · since ${s.now.start}`:k==="paused"?`<b>Paused</b> · ${s.now.site} · ${s.now.pause[0]}`:`<b>Idle</b> · nothing running`;
  const ini=op.name.split(" ").map(w=>w[0]).join("");
  return `<div class="grid orow ${k} ${sel===i?"on":""}" onclick="pick(${i})">
   <div class="who"><div class="av">${ini}<span class="sd"></span></div><div style="min-width:0"><div class="nm">${op.name}<span class="q">${s.q.length} in queue</span></div><div class="st">${st}</div></div></div>
   <div class="lanebox">${lane(op)}</div>
   <div class="res"><b class="num">${fmtL(s.doneL)} L</b><span>${arts(s.done)}</span></div></div>`}).join("");
 return `<svg width="0" height="0" style="position:absolute"><defs><pattern id="hh" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FDE68A"/><rect width="3" height="6" fill="#F59E0B"/></pattern></defs></svg>
 <div class="sec"><div class="sh"><h3>Operators</h3><div class="legend"><span><i style="background:#10B981"></i>Done</span><span><i style="background:#0284C7"></i>Tinting</span><span><i style="background:repeating-linear-gradient(45deg,#F59E0B 0 3px,#FDE68A 3px 6px)"></i>Paused</span></div></div>
 <div class="grid axis"><div class="c1">Operator</div><div class="ticks">${ticks}</div><div class="c3">Today</div></div>${rows}</div>`}

const COLS=`<colgroup><col style="width:84px"><col style="width:11%"><col style="width:9%"><col style="width:44px"><col style="width:15%"><col style="width:17%"><col style="width:8%"><col style="width:9%"><col style="width:6%"><col style="width:8%"><col style="width:12%"><col style="width:36px"></colgroup>
<tr><th>#</th><th>OBD</th><th>Invoice</th><th>SMU</th><th>Bill to</th><th>Ship to</th><th>Route</th><th>Due</th><th class="r">Vol</th><th>Art.</th><th>Status</th><th></th></tr>`;
function cells(j){const [smu,route,dt,due]=ex(j.obd);
 return `<td class="obd"><span class="mono">${j.obd}</span><span class="d">${dt}</span></td><td class="inv mut"></td><td class="mut">${smu}</td><td>${j.bill}</td><td>${j.site}</td><td class="mut">${route}</td>
 <td>${j.st==="done"?'<span class="mut">—</span>':due?`<span class="due">${due}</span>`:'<span class="due none">No due date</span>'}</td><td class="r num">${fmtL(j.vol)}</td><td class="mut">${j.art}</td>`}
function queueRows(op){
 const s=stats(op),ord={tinting:0,assigned:1,paused:2},q=[...s.q].sort((a,b)=>ord[a.st]-ord[b.st]),asg=q.filter(j=>j.st==="assigned");
 return q.map(j=>{let rank;
  if(j.st==="assigned"){const k=asg.indexOf(j);rank=`<div class="rank"><b>${k+1}</b><div class="mv"><button ${k===0?"disabled":""} onclick="event.stopPropagation()">▲</button><button ${k===asg.length-1?"disabled":""} onclick="event.stopPropagation()">▼</button></div></div>`}
  else rank=`<div class="rank"><b style="color:${j.st==="tinting"?"var(--tint-600)":"var(--warn)"}">${j.st==="tinting"?"▶":"Ⅱ"}</b></div>`;
  const pill=j.st==="tinting"?`<span class="pill p-tint">Tinting <small>${j.start}</small></span>`:j.st==="paused"?`<span class="pill p-pause">Paused <small>${j.pause[0]}</small></span>`:`<span class="pill p-asg">Assigned</span>`;
  return `<tr class="row ${j.st}"><td>${rank}</td>${cells(j)}<td>${pill}</td><td class="keb">⋯</td></tr>`}).join("")}
function queue(){
 const ops=sel===null?OPS:[OPS[sel]];
 const tot=ops.reduce((a,o)=>a+stats(o).q.length,0),L=ops.reduce((a,o)=>a+stats(o).qL,0);
 return `<div class="sec"><div class="sh"><h3>Now &amp; next</h3><span class="meta">${tot} jobs · ${fmtL(L)} L · hover a row for ▲▼</span></div>
 ${ops.map((op,i)=>{const st=stats(op);
  return `${i?'<div class="opgap"></div>':""}<div class="ophead"><span>${op.name}</span><span class="gm">${st.q.length} jobs · ${fmtL(st.qL)} L</span></div>
  <table>${COLS}${queueRows(op)||'<tr><td colspan="12" class="empty">Nothing waiting</td></tr>'}</table>`}).join("")}</div>`}
function done(){
 if(sel===null)return "";
 const op=OPS[sel],s=stats(op),d=[...s.done].sort((a,b)=>toM(a.end)-toM(b.end));
 return `<div class="sec"><div class="sh"><h3>Done today · ${op.name}</h3><span class="meta">${d.length} jobs · ${fmtL(s.doneL)} L · first finished first</span></div>
 <table>${COLS}${d.map((j,i)=>`<tr class="row done"><td><div class="rank"><b class="mut">${i+1}</b></div></td>${cells(j)}<td><span class="pill p-done">Done <small>${j.end}</small></span></td><td class="keb">⋯</td></tr>`).join("")}</table></div>`}
function render(){document.getElementById("page").innerHTML=summary()+board()+queue()+done()}
function pick(i){sel=sel===i?null:i;render()}
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&sel!==null){sel=null;render()}});
render();
</script></body></html>
