<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stock Audit</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<style>
:root{
  --bg:#f6f5fb;--card:#ffffff;--ink:#1c1b22;--ink2:#5d5b68;--ink3:#9a98a6;
  --line:#e6e4ee;--brand:#5b3fd1;--brand-ink:#ffffff;--tint:#eeeafd;--tint-ink:#3f2a9e;
  --ok-bg:#e7f5ec;--ok:#1f7a45;--danger:#c0362c;--soft:#f3f2f8;--r:10px;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#121117;--card:#1c1b23;--ink:#f1f0f5;--ink2:#b3b1bf;--ink3:#7d7b89;
  --line:#2e2c38;--brand:#8a72ff;--brand-ink:#0f0d18;--tint:#2a2346;--tint-ink:#c9bdff;
  --ok-bg:#16301f;--ok:#7fd3a0;--danger:#ff8a80;--soft:#24232c;}
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
.app{max-width:480px;margin:0 auto;height:100dvh;display:flex;flex-direction:column;background:var(--card)}
.hd{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}
.hd .t{font-size:16px;font-weight:600}
.hd .s{font-size:12px;color:var(--ink2)}
.bd{flex:1;overflow-y:auto;padding:16px}
input{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);outline:none}
input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--tint)}
button{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer}
button:active{transform:scale(.98)}
.big{width:100%;height:56px;font-size:24px;text-align:center;letter-spacing:1px}
.btn{width:100%;height:52px;font-size:16px;margin-top:12px;font-weight:500}
.pri{background:var(--brand);color:var(--brand-ink);border:none}
.icon{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;flex:none;font-size:18px}
.row{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;gap:10px}
.row.tap{cursor:pointer}
.sub{font-size:12px;color:var(--ink2)}
.mut{font-size:12px;color:var(--ink3)}
.lbl{font-size:13px;color:var(--ink2);margin-bottom:8px}
.f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.f label{font-size:12px;color:var(--ink2);text-align:center}
.f input{height:56px;font-size:24px;text-align:center;width:100%}
.x{font-size:20px;color:var(--ink3);padding-top:20px;flex:none}
.line{display:flex;gap:6px;align-items:flex-start}
.tg{display:flex;gap:8px;margin-bottom:14px}
.tg button{flex:1;height:42px;font-size:14px}
.on{background:var(--tint);color:var(--tint-ink);border-color:var(--brand)}
.total{text-align:center;margin-top:16px;background:var(--soft);border-radius:var(--r);padding:14px}
.total .n{font-size:36px;font-weight:600}
.err{font-size:13px;color:var(--danger);margin-top:6px;min-height:18px}
.toast{background:var(--ok-bg);color:var(--ok);font-size:14px;padding:10px 12px;border-radius:var(--r);margin-bottom:12px}
.nav{display:flex;border-top:1px solid var(--line);flex:none;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;height:62px;border:none;border-radius:0;font-size:13px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--ink2);background:var(--card)}
.nav .act{color:var(--brand);font-weight:600}
.empty{font-size:14px;color:var(--ink2);padding:24px 0;text-align:center}
</style>
</head>
<body>
<div class="app" id="app"></div>
<script>
/* Mockup data — replace with API in the real build */
const SKUS=[
  {c:'5233221',n:'Weathershield Max White',p:'20 L',ctn:0},
  {c:'5233418',n:'Weathershield Max White',p:'1 L',ctn:12},
  {c:'5180044',n:'Velvet Touch Pearl Glo',p:'4 L',ctn:4},
  {c:'5233412',n:'Promise Interior Base',p:'10 L',ctn:0}
];
const AUDITS=[
  {no:'SA-0012',z:'Started today 9:00 AM'},
  {no:'SA-0011',z:'Started 31 Oct'}
];
const USER='Rakesh';

let lines=[],cur=null,mode='pcs',edit=-1,v={},au=null,tab='count',msg='';
const $=id=>document.getElementById(id),app=$('app');
const n=k=>parseInt(v[k])||0;
const fmt=x=>x.toLocaleString('en-IN');
const num=(id,lb,val)=>`<div class="f"><label for="${id}">${lb}</label><input id="${id}" inputmode="numeric" pattern="[0-9]*" autocomplete="off" value="${val||''}" oninput="calc()"></div>`;

function home(){
  au=null;
  if(AUDITS.length===1){openAudit(0);return;}
  app.innerHTML=`<div class="hd"><div class="t">Stock audit</div><div class="s">${USER}</div></div>
  <div class="bd"><div class="lbl">Your open audits</div>
  ${AUDITS.map((a,i)=>`<div class="row tap" onclick="openAudit(${i})"><div><div style="font-weight:600">${a.no}</div><div class="sub">${a.z}</div></div><i class="ti ti-chevron-right"></i></div>`).join('')}
  <div class="mut" style="margin-top:14px">Only audits you're assigned to show here. If there's just one, it opens straight away.</div></div>`;
}
function openAudit(i){au=AUDITS[i];tab='count';cur=null;edit=-1;msg='';draw();}

function frame(body){
  app.innerHTML=`<div class="hd"><div style="display:flex;align-items:center;gap:10px">
    ${AUDITS.length>1?`<button class="icon" aria-label="Back" onclick="home()"><i class="ti ti-arrow-left"></i></button>`:''}
    <div><div class="t">${au.no}</div><div class="s">${au.z}</div></div></div><div class="s">${USER}</div></div>
  <div class="bd">${body}</div>
  <nav class="nav">
    <button class="${tab==='count'?'act':''}" onclick="go('count')"><i class="ti ti-search" style="font-size:22px"></i>Count</button>
    <button class="${tab==='sub'?'act':''}" onclick="go('sub')"><i class="ti ti-list-check" style="font-size:22px"></i>Submitted (${lines.length})</button>
  </nav>`;
}
function go(t){tab=t;edit=-1;cur=null;msg='';draw();}
function draw(){if(tab==='sub')return submitted();if(cur)return counter();search();}

function search(){
  frame(`${msg?`<div class="toast">${msg}</div>`:''}<div class="lbl">Enter SKU code</div>
  <input id="q" class="big" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="5233221" oninput="find()"><div id="res"></div>`);
  find();
}
function find(){
  const q=$('q').value.trim();
  const r=SKUS.filter(x=>x.c.includes(q));
  $('res').innerHTML=r.map(x=>`<div class="row tap" onclick="pick('${x.c}')"><div><div style="font-weight:600">${x.c}</div><div class="sub">${x.n} · ${x.p}</div></div><i class="ti ti-chevron-right"></i></div>`).join('')||'<div class="err">No SKU with that code</div>';
}
function pick(c){cur=SKUS.find(x=>x.c===c);mode=cur.ctn?'ctn':'pcs';v={s:'',r:'',d:'',c:cur.ctn||'',l:''};msg='';counter();setTimeout(()=>$('s')&&$('s').focus(),50);}

function counter(){
  frame(`<div style="font-weight:600;font-size:16px">${cur.c}</div><div class="sub" style="margin-bottom:14px">${cur.n} · ${cur.p}</div>
  <div class="tg"><button class="${mode==='pcs'?'on':''}" onclick="sw('pcs')">Pieces</button><button class="${mode==='ctn'?'on':''}" onclick="sw('ctn')">Cartons</button></div>
  <div class="line">${num('s','Stack',v.s)}<span class="x">×</span>${num('r','Rows',v.r)}<span class="x">×</span>${num('d','Depth',v.d)}</div>
  <div class="line" style="margin-top:10px">${mode==='ctn'?`<span class="x">×</span>${num('c','Pcs / carton',v.c)}`:''}<span class="x">+</span>${num('l','Loose pcs',v.l)}</div>
  <div class="total"><div id="fx" class="sub">—</div><div id="tot" class="n">0</div><div class="sub">pieces</div></div>
  <div class="err" id="e"></div>
  <button class="btn pri" onclick="save()">${edit>=0?'Update':'Submit'}</button>
  <button class="btn" onclick="cancel()">Cancel</button>`);
  calc();
}
function sw(m){read();mode=m;counter();}
function read(){['s','r','d','c','l'].forEach(k=>{if($(k))v[k]=$(k).value;});}
function calc(){
  read();
  const t=n('s')*n('r')*n('d')*(mode==='ctn'?n('c'):1)+n('l');
  $('tot').textContent=fmt(t);
  $('fx').textContent=`${n('s')} × ${n('r')} × ${n('d')}`+(mode==='ctn'?` × ${n('c')}`:'')+(n('l')?` + ${n('l')}`:'');
  $('e').textContent='';
  return t;
}
function save(){
  const t=calc();
  if(!t){$('e').textContent='Enter a count first';return;}
  if(mode==='ctn'&&!(n('c')>0)){$('e').textContent='Enter pieces per carton';return;}
  const ln={sku:cur,mode,s:v.s,r:v.r,d:v.d,c:v.c,l:v.l,t,at:new Date()};
  const was=edit>=0;
  if(was)lines[edit]=ln;else lines.unshift(ln);
  msg=`${was?'Updated':'Submitted'} ${cur.c} · ${fmt(t)} pcs`;
  cur=null;edit=-1;tab=was?'sub':'count';draw();
}
function cancel(){const was=edit>=0;cur=null;edit=-1;msg='';tab=was?'sub':'count';draw();}

function submitted(){
  frame(`${msg?`<div class="toast">${msg}</div>`:''}<div class="lbl">Your entries in ${au.no}</div>
  ${lines.length?lines.map((x,i)=>`<div class="row"><div style="min-width:0">
    <div style="font-weight:600">${x.sku.c} · ${fmt(x.t)} pcs</div>
    <div class="sub">${x.sku.n} · ${x.sku.p}</div>
    <div class="mut">${x.s||0}×${x.r||0}×${x.d||0}${x.mode==='ctn'?'×'+x.c:''}${x.l?' + '+x.l:''} · ${x.at.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit'})}</div>
  </div><button class="icon" aria-label="Edit" onclick="editLine(${i})"><i class="ti ti-edit"></i></button></div>`).join('')
  :'<div class="empty">Nothing submitted yet. Counts you submit show here.</div>'}`);
}
function editLine(i){edit=i;const x=lines[i];cur=x.sku;mode=x.mode;v={s:x.s,r:x.r,d:x.d,c:x.c,l:x.l};msg='';tab='count';counter();}

home();
</script>
</body>
</html>
