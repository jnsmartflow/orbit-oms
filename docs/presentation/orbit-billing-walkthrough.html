:root{
  --sans:"Plus Jakarta Sans","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  --mono:"JetBrains Mono","Consolas","SF Mono",ui-monospace,monospace;
  --b50:#F5F3FF; --b600:#7C3AED; --b700:#6D28D9; --b800:#5B21B6;
  --g50:#F9FAFB; --g100:#F3F4F6; --g200:#E5E7EB; --g300:#D1D5DB; --g400:#9CA3AF;
  --g500:#6B7280; --g600:#4B5563; --g700:#374151; --g800:#1F2937; --g900:#111827;
  --ok50:#F0FDF4; --ok200:#BBF7D0; --ok600:#16A34A; --ok700:#15803D;
  --blue:#2563EB; --orange:#EA580C;
  --ink:#1B1826; --muted:#74718A; --faint:#9C99AC; --rule:#E9E7F0;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden}
body{font-family:var(--sans);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
svg{display:block;flex:0 0 auto}

/* ── the 16:9 stage — drawn at 1440×810, scaled to the window ───────────── */
.stage{
  position:fixed;left:50%;top:50%;width:1440px;height:810px;overflow:hidden;background:#fff;
  transform-origin:50% 50%;transform:translate(-50%,-50%) scale(1);
}
.nomotion *,.nomotion *::before,.nomotion *::after{transition:none!important;animation:none!important}

/* the headline band */
.head{position:absolute;left:40px;right:40px;top:22px;height:80px}
.hl{margin:0;font-size:34px;line-height:1.15;font-weight:700;letter-spacing:-.025em;color:var(--ink)}
.sl{margin:6px 0 0;font-size:17px;line-height:1.35;font-weight:500;color:var(--muted);min-height:23px}
.hl[data-f="1"],.sl[data-f="1"]{animation:capA .32s ease-out both}
.hl[data-f="0"],.sl[data-f="0"]{animation:capB .32s ease-out both}
@keyframes capA{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@keyframes capB{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* the controls */
.foot{position:absolute;left:40px;right:40px;bottom:0;height:46px;display:flex;align-items:center;justify-content:space-between}
.count{width:160px;font-family:var(--mono);font-size:13px;color:var(--faint);font-variant-numeric:tabular-nums}
.dots{display:flex;gap:7px}
.dots button{width:9px;height:9px;border-radius:999px;background:var(--rule);transition:background .2s,width .2s}
.dots button[data-on="1"]{background:var(--b600);width:26px}
.nav{width:160px;display:flex;justify-content:flex-end;gap:10px}
.nav button{border:1.5px solid var(--rule);border-radius:11px;padding:6px 18px;font-size:15px;font-weight:600;color:var(--ink)}
.nav button.pri{background:var(--b600);border-color:var(--b600);color:#fff}
.nav button:disabled{opacity:.35;cursor:default}

/* ── the view: the desk and the billing-system grid share it ────────────── */
.view{position:absolute;left:0;top:104px;width:1440px;height:660px;overflow:hidden}

.desk{
  position:absolute;left:40px;top:8px;width:1360px;height:644px;display:flex;overflow:hidden;
  background:#fff;border:1px solid var(--g200);border-radius:12px;
  box-shadow:0 1px 2px rgba(17,24,39,.05),0 12px 32px -12px rgba(17,24,39,.16);
  transform-origin:0 50%;transform:none;transition:transform .7s var(--ease);
}
.stage[data-grid="1"] .desk{transform:translateX(-375px) scale(.9)}

/* sidebar, collapsed */
.side{flex:0 0 72px;border-right:1px solid var(--g200);display:flex;flex-direction:column;align-items:stretch}
.wm{height:56px;display:flex;align-items:center;justify-content:center;color:var(--b800)}
.navrow{
  height:40px;margin-top:6px;display:flex;align-items:center;justify-content:center;
  background:var(--b50);border-left:2px solid var(--b600);color:var(--b700);
}

/* inbox rail */
.rail{flex:0 0 300px;border-right:1px solid var(--g200);display:flex;flex-direction:column}
.rhead{
  height:30px;flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;
  padding:0 14px;font-size:10px;color:var(--g400);border-bottom:1px solid var(--g100);
}
.rhead .l{display:flex;align-items:center;gap:6px}
.rhead .l span{text-transform:uppercase;letter-spacing:.025em}
.rhead .pct{color:var(--blue)}
.rhead .pct[data-full="1"]{color:var(--ok600)}
.orow{
  padding:10px 14px 10px 11px;border-bottom:1px solid var(--g100);border-left:3px solid transparent;
  background:#fff;opacity:1;
  transition:background .3s ease,border-color .3s ease,opacity .45s ease;
}
.orow .n{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--g900);white-space:nowrap;overflow:hidden}
.orow .dot{width:5px;height:5px;border-radius:999px;flex:0 0 auto}
.orow .m{margin:2px 0 0 12px;font-size:11px;color:var(--g400);white-space:nowrap}
.orow[data-state="focus"]{background:var(--b50);border-left-color:var(--b600)}
.orow[data-state="punched"]{opacity:.4;border-left-color:transparent}
.stage[data-punched="1"] .orow[data-state="punched"]{transition-delay:.55s}
.stage[data-punched="1"] .orow[data-state="focus"]{transition-delay:1s}

/* right pane */
.pane{flex:1 1 auto;min-width:0;position:relative;display:flex;flex-direction:column}
.empty{
  position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  opacity:1;transition:opacity .3s ease;
}
.empty .o{font-size:28px;line-height:1;color:var(--g300)}
.empty .t{font-size:13px;font-weight:600;color:var(--g400)}
.detail{flex:1 1 auto;min-height:0;display:flex;flex-direction:column;opacity:0;transform:translateY(6px);
  transition:opacity .35s ease,transform .35s var(--ease)}
.stage[data-open="1"] .empty{opacity:0}
.stage[data-open="1"] .detail{opacity:1;transform:none;transition-delay:.12s}

.dhead{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 20px 12px}
.billto{width:360px;min-height:64px;background:#fff;border:1px solid var(--g200);border-radius:8px;padding:10px 12px}
.billto .cap{font-size:9.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--g400)}
.billto .nm{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:14.5px;font-weight:700;color:var(--g900)}
.billto .nm i{width:6px;height:6px;border-radius:999px;background:var(--blue);flex:0 0 auto}
.billto .dt{margin-top:3px;display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--g500)}
.billto .dt .sep{color:var(--g300)}
.chip{font-family:var(--mono);font-size:11px;background:var(--g100);color:var(--g700);border-radius:4px;padding:1px 5px}

/* the order number: field + Punch, then the green pill */
.so{position:relative;height:32px;width:300px}
.soedit,.sodone{position:absolute;right:0;top:0;height:32px;display:flex;align-items:center;gap:8px;
  transition:opacity .3s ease,visibility .3s}
.sodone{opacity:0;visibility:hidden}
.stage[data-punched="1"] .soedit{opacity:0;visibility:hidden;transition-delay:.35s}
.stage[data-punched="1"] .sodone{opacity:1;visibility:visible;transition-delay:.5s}
.sofield{
  height:30px;display:flex;align-items:center;gap:8px;padding:0 10px;background:#fff;
  border:1px solid var(--g200);border-radius:10px;box-shadow:0 0 0 0 rgba(124,58,237,0);
  transition:border-color .3s ease,box-shadow .3s ease;
}
.sofield .cap{font-size:10px;font-weight:500;color:var(--g400);white-space:nowrap}
.sov{position:relative;width:120px;height:20px;font-family:var(--mono);font-size:14px;font-weight:500;line-height:20px}
.sov span{position:absolute;left:0;top:0;white-space:nowrap;transition:opacity .25s ease}
.sov .ph{color:var(--g400);font-size:13px}
.sov .num{color:var(--g900);opacity:0}
.stage[data-num="1"] .sofield{border-color:var(--b600);box-shadow:0 0 0 2px rgba(124,58,237,.15);transition-delay:.55s}
.stage[data-num="1"] .sov .ph{opacity:0;transition-delay:.7s}
.stage[data-num="1"] .sov .num{opacity:1;transition-delay:.7s}
.punch{height:32px;padding:0 14px;border-radius:6px;font-size:12px;font-weight:600;background:var(--g100);color:var(--g300);
  cursor:default;transition:background .3s ease,color .3s ease}
.stage[data-num="1"] .punch{background:var(--b600);color:#fff;transition-delay:.95s}
.pill{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ok200);background:var(--ok50);
  border-radius:6px;padding:2px 8px;color:var(--ok600)}
.pill b{font-family:var(--mono);font-size:14px;font-weight:500;color:var(--ok700)}

/* meta row */
.meta{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 20px 10px;border-top:1px solid var(--g100)}
.segs{display:flex;align-items:center;gap:7px;font-size:11.5px;color:var(--g500)}
.segs .sep{color:var(--g300)}
.ready{font-size:10px;font-weight:600;color:var(--ok700);background:var(--ok50);border:1px solid var(--ok200);border-radius:4px;padding:1px 6px}
.acts{display:flex;align-items:center;gap:6px}
.abtn{height:26px;display:flex;align-items:center;gap:5px;padding:0 9px;border:1px solid var(--g200);border-radius:6px;
  background:#fff;font-size:11px;font-weight:500;color:var(--g600);cursor:default;
  transition:background .25s ease,border-color .25s ease,color .25s ease,box-shadow .25s ease,transform .15s ease}
.stage[data-copied="1"] .copybtn{background:var(--b50);border-color:var(--b600);color:var(--b700);
  box-shadow:0 0 0 3px rgba(124,58,237,.22);transform:scale(.97)}

/* the line table */
.tbox{flex:1 1 auto;min-height:0;overflow:hidden;padding:0 6px}
table{width:100%;table-layout:fixed;border-collapse:collapse}
th{height:32px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;color:#9ca3af;background:#f9fafb;
  border-bottom:1px solid #ebebeb;padding:0 14px;text-align:left;white-space:nowrap;overflow:hidden;
  transition:background .3s ease,color .3s ease}
td{height:40px;padding:0 14px;font-size:12px;color:var(--g700);border-bottom:1px solid var(--g100);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .3s ease}
th.nw,td.nw{padding:0 7px}
.al-c{text-align:center}.al-r{text-align:right}
td.n{font-family:var(--mono);font-size:11px;color:var(--g400)}
td.sku{font-family:var(--mono);font-size:12px;color:#6b7280}
td.alt{color:var(--g300)}
td.ds{font-size:11.5px;color:var(--g800)}
td.pk{font-family:var(--mono);font-size:11px;color:var(--g600)}
td.q{font-family:var(--mono);font-size:12px;font-weight:600;color:var(--g900)}
td.v{font-family:var(--mono);font-size:11.5px;color:var(--g500)}
.sw{display:inline-block;vertical-align:middle;width:26px;height:14px;border-radius:999px;background:#22c55e;position:relative}
.sw::after{content:"";position:absolute;right:2px;top:2px;width:10px;height:10px;border-radius:999px;background:#fff}
td.more{color:var(--g300)}
td.more svg{margin:0 auto}
.tbox tbody tr{opacity:0;transition:opacity .25s ease}
.stage[data-open="1"] .tbox tbody tr{opacity:1;transition-delay:calc(.25s + var(--i) * 45ms)}
.stage[data-copied="1"] .wash{background:rgba(124,58,237,.09)}
.stage[data-copied="1"] th.wash{background:#EFEAFD;color:var(--b700)}
.stage[data-copied="1"] td.sku.wash{color:var(--b700)}

/* toast */
.toast{position:absolute;right:20px;bottom:20px;display:flex;align-items:center;gap:8px;padding:9px 16px 9px 12px;
  border-radius:999px;background:var(--ink);color:#fff;font-size:13px;font-weight:600;
  opacity:0;transform:translateY(10px);transition:opacity .25s ease,transform .3s var(--ease)}
.toast svg{color:#4ADE80}
.stage[data-toast="1"] .toast{opacity:1;transform:none;transition-delay:.3s}

/* ── the billing system's entry grid — neutral on purpose ───────────────── */
.grid{
  position:absolute;right:40px;top:8px;width:460px;height:644px;background:#fff;
  border:1px solid var(--g300);border-radius:10px;overflow:hidden;
  box-shadow:0 24px 56px -16px rgba(17,24,39,.28);
  transform:translateX(calc(100% + 80px));opacity:0;
  transition:transform .7s var(--ease),opacity .4s ease;
}
.stage[data-grid="1"] .grid{transform:none;opacity:1;transition-delay:.08s}
.gbar{height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:var(--g100);
  border-bottom:1px solid var(--g300)}
.gbar .t{font-size:12.5px;font-weight:600;color:var(--g700)}
.gno{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--g500)}
.gno .box{position:relative;width:118px;height:26px;border:1px solid var(--g300);border-radius:4px;background:#fff;
  transition:background .4s ease,border-color .4s ease}
.gno .box span{position:absolute;left:8px;top:0;line-height:24px;font-family:var(--mono);font-size:13px;color:var(--g900);
  opacity:0;transition:opacity .3s ease}
.stage[data-num="1"] .gno .box{background:#FFFBEB;border-color:var(--g500)}
.stage[data-num="1"] .gno .box span{opacity:1}
.gt{width:100%;table-layout:fixed;border-collapse:collapse}
.gt th{height:30px;padding:0 10px;background:var(--g50);border:1px solid var(--g200);border-top:0;
  font-size:11px;font-weight:600;letter-spacing:0;text-transform:none;color:var(--g600)}
.gt td{height:30px;padding:0 10px;border:1px solid var(--g200);font-size:12.5px;color:var(--g900);background:#fff}
.gt th:first-child,.gt td:first-child{border-left:0;background:var(--g50);color:var(--g400);font-family:var(--mono);
  font-size:10.5px;text-align:center;padding:0}
.gt td.gm{font-family:var(--mono)}
.gt td.gq{font-family:var(--mono);text-align:right}
.gt td.cur{box-shadow:inset 0 0 0 2px var(--g700)}
.gt td .cv{display:block;opacity:0;transform:translateY(-3px);transition:opacity .16s ease,transform .16s ease}
.stage[data-grid="1"] .gt td .cv{opacity:1;transform:none;transition-delay:calc(.75s + var(--i) * 110ms)}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{transition-duration:0s!important;transition-delay:0s!important;animation:none!important}
}
</style>
</head>
<body>

<div class="stage" id="stage" data-beat="1" data-open="0" data-copied="0" data-toast="0" data-grid="0" data-num="0" data-punched="0">

  <div class="head" aria-live="polite">
    <p class="hl" id="hl" data-f="1"></p>
    <p class="sl" id="sl" data-f="1"></p>
  </div>

  <div class="view">

    <div class="desk" aria-hidden="true">

      <div class="side">
        <div class="wm"><svg viewBox="0 0 2316 769" height="14" width="42" fill="currentColor" role="img" aria-label="Orbit"><path fill-rule="nonzero" d="M389 769L389 769Q306 769 235.5 740Q165 711 112 659Q59 607 29.5 537Q0 467 0 384L0 384Q0 301 29 231Q58 161 111 109Q164 57 235 28.5Q306 0 389 0L389 0Q472 0 543 29Q614 58 667 109.5Q720 161 749.5 231Q779 301 779 384L779 384Q779 467 749 537Q719 607 666 659Q613 711 542.5 740Q472 769 389 769M389 645L389 645Q462 645 519 611Q576 577 609 518Q642 459 642 384L642 384Q642 309 609 250Q576 191 519 157.5Q462 124 389 124L389 124Q316 124 259 157.5Q202 191 169 250Q136 309 136 384L136 384Q136 459 169 518Q202 577 259.5 611Q317 645 389 645M974 757L843 757L843 213L966 213L966 289Q987 244 1025 225.5Q1063 207 1113 207L1113 207L1145 207L1145 323L1098 323Q1043 323 1008.5 357.5Q974 392 974 454L974 454L974 757M1468 769L1468 769Q1415 769 1369.5 750.5Q1324 732 1294 696L1294 696L1294 757L1171 757L1171 0L1302 0L1302 268Q1331 236 1373.5 218.5Q1416 201 1469 201L1469 201Q1546 201 1608 239Q1670 277 1706.5 341Q1743 405 1743 485L1743 485Q1743 565 1707 629.5Q1671 694 1609 731.5Q1547 769 1468 769M1453 649L1453 649Q1498 649 1532.5 628Q1567 607 1587 570Q1607 533 1607 485L1607 485Q1607 438 1587 401Q1567 364 1532.5 342.5Q1498 321 1453 321L1453 321Q1409 321 1375 342.5Q1341 364 1321.5 401Q1302 438 1302 485L1302 485Q1302 533 1321.5 570Q1341 607 1375 628Q1409 649 1453 649M1928 152L1797 152L1797 12L1928 12L1928 152M1928 757L1797 757L1797 213L1928 213L1928 757M2251 763L2251 763Q2159 763 2108.5 712.5Q2058 662 2058 570L2058 570L2058 330L1964 330L1964 213L1974 213Q2014 213 2036 192Q2058 171 2058 131L2058 131L2058 89L2189 89L2189 213L2314 213L2314 330L2189 330L2189 563Q2189 604 2211 626Q2233 648 2281 648L2281 648Q2296 648 2316 645L2316 645L2316 757Q2302 759 2284 761Q2266 763 2251 763"/></svg></div>
        <div class="navrow"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg></div>
      </div>

      <div class="rail">
        <div class="rhead">
          <div class="l"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg><span>Inbox</span></div>
          <div><span id="rtotal">5 orders</span> <span class="pct" id="rpct" data-full="0">· 0% punched</span></div>
        </div>
        <div id="orows"></div>
      </div>

      <div class="pane">
        <div class="empty"><div class="o">○</div><div class="t">No order open</div></div>

        <div class="detail">
          <div class="dhead">
            <div class="billto">
              <div class="cap">Bill to</div>
              <div class="nm"><i></i><span id="btname"></span></div>
              <div class="dt"><span class="chip" id="btcode"></span><span class="sep">·</span><span id="btarea"></span><span class="sep">·</span><span id="bttype"></span></div>
            </div>
            <div class="so">
              <div class="soedit">
                <div class="sofield"><span class="cap">Order No.</span><div class="sov"><span class="ph">Enter number</span><span class="num" id="sonum"></span></div></div>
                <button class="punch" tabindex="-1">Punch</button>
              </div>
              <div class="sodone">
                <span class="pill"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><b id="sopill"></b></span>
              </div>
            </div>
          </div>

          <div class="meta">
            <div class="segs"><span id="mrecv"></span><span class="sep">·</span><span id="mvol"></span><span class="sep">·</span><span class="ready" id="mready"></span></div>
            <div class="acts">
              <button class="abtn" tabindex="-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"/><path d="M15 3v4a2 2 0 0 0 2 2h4"/></svg>Notes</button>
              <button class="abtn copybtn" tabindex="-1"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="14" height="14" x="8" y="8" rx="2" ry="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>Copy</button>
            </div>
          </div>

          <div class="tbox">
            <table>
              <colgroup>
                <col style="width:4%"><col style="width:20%"><col style="width:11%"><col style="width:8%"><col style="width:22%">
                <col style="width:5.5%"><col style="width:5.5%"><col style="width:5.5%"><col style="width:12%"><col style="width:6.5%">
              </colgroup>
              <thead><tr>
                <th class="nw">#</th><th>Raw Text</th><th class="wash">SKU Code</th><th class="al-c nw">ALT SKU</th><th>Description</th>
                <th class="al-c nw">Pk</th><th class="al-r nw wash">Qty</th><th class="al-r nw">Vol</th><th class="al-c">Status</th><th></th>
              </tr></thead>
              <tbody id="lines"></tbody>
            </table>
          </div>
        </div>

        <div class="toast"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg><span id="toast"></span></div>
      </div>
    </div>

    <div class="grid" aria-hidden="true">
      <div class="gbar">
        <span class="t">Billing system · item entry</span>
        <span class="gno">Order no.<span class="box"><span id="gnum"></span></span></span>
      </div>
      <table class="gt">
        <colgroup><col style="width:38px"><col><col style="width:150px"></colgroup>
        <thead><tr><th></th><th>Material</th><th class="al-r">Order quantity</th></tr></thead>
        <tbody id="grows"></tbody>
      </table>
    </div>

  </div>

  <div class="foot">
    <span class="count" id="count"></span>
    <div class="dots" id="dots"></div>
    <div class="nav">
      <button id="prev">Back</button>
      <button id="next" class="pri">Next</button>
    </div>
  </div>
</div>

<script>
/* Orbit — the billing desk. Self-contained: no network, no storage. */
"use strict";

/* ── the five orders. Dealers are invented; codes and packs from the depot's SKU table. */
var ORDERS = [
  { name:"Ambika Paints",            code:"447636", area:"Katargam", type:"Local",     dot:"#2563EB", lines:9, vol:150, recv:"10:42" },
  { name:"Shreeji Paint House",      code:"512804", area:"Adajan",   type:"Local",     dot:"#2563EB", lines:2, vol:22,  recv:"10:48" },
  { name:"Navrang Colour Centre",    code:"438117", area:"Varachha", type:"Local",     dot:"#2563EB", lines:3, vol:100, recv:"10:55" },
  { name:"Maruti Hardware & Paints", code:"466390", area:"Udhna",    type:"Upcountry", dot:"#EA580C", lines:1, vol:20,  recv:"11:03" },
  { name:"Krishna Paint Depot",      code:"471255", area:"Pal",      type:"Local",     dot:"#2563EB", lines:4, vol:88,  recv:"11:10" }
];

/* Order 1 — the order Part 1 builds. Nine lines, all matched. */
var LINES = [
  { raw:"Gloss Black 1L*12",                      sku:"IN28012272", desc:"DN GLOSS BLACK 1L",                       pk:"1",     qty:12, vol:12 },
  { raw:"Gloss 90 Base 4L*8",                     sku:"IN28209071", desc:"DN GLOSS WHITE BASE NEW 4L",              pk:"4",     qty:8,  vol:32 },
  { raw:"VT Pearl Glo Brilliant White 1L*6",      sku:"IN30600023", desc:"DN VT PEARL GLO NEW BRILLIANT WHITE 1L",  pk:"1",     qty:6,  vol:6  },
  { raw:"20L*1",                                  sku:"IN30600081", desc:"DN VT PEARL GLO NEW BRILLIANT WHITE 20L", pk:"20",    qty:1,  vol:20 },
  { raw:"Promise Smartchoice Exterior 4L*4",      sku:"5579815",    desc:"PROMISE SMARTCH EXT BR WHT/WHT BAS 4L",   pk:"4",     qty:4,  vol:16 },
  { raw:"20L*1",                                  sku:"5579817",    desc:"PROMISE SMARTCH EXT BR WHT/WHT BAS 20L",  pk:"20",    qty:1,  vol:20 },
  { raw:"Universal Stainer Fast Violet 100ML*20", sku:"IN65010698", desc:"DN Stainer Fast Violet 100ML",            pk:"100ML", qty:20, vol:2  },
  { raw:"200ML*10",                               sku:"IN65010674", desc:"DN Stainer Fast Violet 200ML",            pk:"200ML", qty:10, vol:2  },
  { raw:"Damp Protect 2in1 20L*2",                sku:"5908366",    desc:"DN AQUATECH DAMP PROTECT 2IN1 20L",       pk:"20",    qty:2,  vol:40 }
];

/* An invented order number — not a real one. */
var ORDER_NO = "4512890077";
var GRID_ROWS = 18;

var BEATS = [
  { h:"Orders land here.",              s:"No one types them in." },
  { h:"He opens one.",                  s:"Every line already carries its code." },
  { h:"One click copies the codes.",    s:"Code and quantity, every line." },
  { h:"One paste fills the order.",     s:"" },
  { h:"The order number comes back.",   s:"" },
  { h:"The order is closed.",           s:"Four left. The same three steps." }
];

/* ── build once. Nothing below this block creates or replaces nodes again. ── */
function el(tag, cls, text) {
  var n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text != null) n.textContent = text;
  return n;
}
var $ = function (id) { return document.getElementById(id); };

var railRows = [];
ORDERS.forEach(function (o) {
  var row = el("div", "orow");
  row.setAttribute("data-state", "idle");
  var n = el("div", "n");
  var d = el("span", "dot"); d.style.background = o.dot;
  n.appendChild(d); n.appendChild(el("span", null, o.name));
  row.appendChild(n);
  row.appendChild(el("div", "m", o.area + " · " + o.lines + (o.lines === 1 ? " line" : " lines") + " · " + o.vol + " L"));
  $("orows").appendChild(row);
  railRows.push(row);
});

var MORE = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>';
LINES.forEach(function (l, i) {
  var tr = el("tr");
  tr.style.setProperty("--i", i);
  tr.appendChild(el("td", "n nw", String(i + 1)));
  tr.appendChild(el("td", null, l.raw));
  tr.appendChild(el("td", "sku wash", l.sku));
  tr.appendChild(el("td", "alt al-c nw", "—"));
  var ds = el("td", "ds", l.desc); ds.title = l.desc; tr.appendChild(ds);
  tr.appendChild(el("td", "pk al-c nw", l.pk));
  tr.appendChild(el("td", "q al-r nw wash", String(l.qty)));
  tr.appendChild(el("td", "v al-r nw", l.vol + " L"));
  var st = el("td", "al-c"); st.appendChild(el("span", "sw")); tr.appendChild(st);
  var mo = el("td", "more"); mo.innerHTML = MORE; tr.appendChild(mo);   /* one static icon, at load */
  $("lines").appendChild(tr);
});

/* The paste lands in the order it was copied: matched lines only, code then quantity. */
var copied = LINES.filter(function (l) { return l.sku; });
for (var r = 0; r < GRID_ROWS; r++) {
  var gtr = el("tr");
  gtr.appendChild(el("td", null, String(r + 1)));
  var gm = el("td", "gm"), gq = el("td", "gq");
  if (r === 0) gm.className += " cur";
  if (r < copied.length) {
    var a = el("span", "cv", copied[r].sku), b = el("span", "cv", String(copied[r].qty));
    a.style.setProperty("--i", r); b.style.setProperty("--i", r);
    gm.appendChild(a); gq.appendChild(b);
  }
  gtr.appendChild(gm); gtr.appendChild(gq);
  $("grows").appendChild(gtr);
}

var O1 = ORDERS[0];
$("btname").textContent = O1.name;
$("btcode").textContent = O1.code;
$("btarea").textContent = O1.area;
$("bttype").textContent = O1.type;
$("mrecv").textContent = "Received " + O1.recv;
$("mvol").textContent = O1.vol + " L";
$("mready").textContent = "✓ " + copied.length + "/" + LINES.length;
$("toast").textContent = copied.length + " SKUs copied";
$("sonum").textContent = ORDER_NO;
$("sopill").textContent = ORDER_NO;
$("gnum").textContent = ORDER_NO;

var dotBtns = BEATS.map(function (_, i) {
  var btn = el("button");
  btn.setAttribute("aria-label", "Step " + (i + 1));
  btn.addEventListener("click", function () { go(i + 1); });
  $("dots").appendChild(btn);
  return btn;
});

/* ── one render pass per beat: attributes and text on nodes that already exist ── */
var stage = $("stage");
var beat = 1;
var flip = 1;

function render() {
  var b = beat;
  stage.setAttribute("data-beat", String(b));
  stage.setAttribute("data-open",    b >= 2 ? "1" : "0");
  stage.setAttribute("data-copied",  b === 3 || b === 4 ? "1" : "0");
  stage.setAttribute("data-toast",   b === 3 ? "1" : "0");
  stage.setAttribute("data-grid",    b === 4 || b === 5 ? "1" : "0");
  stage.setAttribute("data-num",     b >= 5 ? "1" : "0");
  stage.setAttribute("data-punched", b >= 6 ? "1" : "0");

  var punched = b >= 6 ? 1 : 0;
  var pct = Math.round(punched / ORDERS.length * 100);
  $("rtotal").textContent = ORDERS.length + " orders";
  $("rpct").textContent = "· " + pct + "% punched";
  $("rpct").setAttribute("data-full", pct === 100 ? "1" : "0");

  railRows.forEach(function (row, i) {
    var s = "idle";
    if (i === 0) s = b >= 6 ? "punched" : (b >= 2 ? "focus" : "idle");
    if (i === 1 && b >= 6) s = "focus";
    row.setAttribute("data-state", s);
  });

  flip = flip ? 0 : 1;
  $("hl").textContent = BEATS[b - 1].h;
  $("sl").textContent = BEATS[b - 1].s;
  $("hl").setAttribute("data-f", String(flip));
  $("sl").setAttribute("data-f", String(flip));

  $("count").textContent = b + " / " + BEATS.length;
  dotBtns.forEach(function (btn, i) { btn.setAttribute("data-on", i === b - 1 ? "1" : "0"); });
  $("prev").disabled = b === 1;
  $("next").disabled = b === BEATS.length;
}

function go(n) {
  n = Math.max(1, Math.min(BEATS.length, n));
  if (n === beat) return;
  beat = n;
  render();
}

$("next").addEventListener("click", function () { go(beat + 1); });
$("prev").addEventListener("click", function () { go(beat - 1); });
document.addEventListener("keydown", function (e) {
  /* a focused button already answers Space and Enter with its own click */
  if (e.target && e.target.tagName === "BUTTON" && (e.key === " " || e.key === "Enter")) return;
  if (e.key === "ArrowRight" || e.key === " " || e.key === "PageDown") { e.preventDefault(); go(beat + 1); }
  else if (e.key === "ArrowLeft" || e.key === "PageUp") { e.preventDefault(); go(beat - 1); }
  else if (e.key === "Home") { e.preventDefault(); go(1); }
  else if (e.key === "End") { e.preventDefault(); go(BEATS.length); }
});

/* ── fit the 1440×810 stage to the window ── */
function fit() {
  var s = Math.min(window.innerWidth / 1440, window.innerHeight / 810);
  if (!isFinite(s) || s <= 0) s = 1;
  stage.style.transform = "translate(-50%,-50%) scale(" + s + ")";
}
window.addEventListener("resize", fit);

/* First paint lands on beat 1 without playing any transition. */
stage.classList.add("nomotion");
fit();
render();
window.requestAnimationFrame(function () {
  window.requestAnimationFrame(function () { stage.classList.remove("nomotion"); });
});
</script>
</body>
</html>
